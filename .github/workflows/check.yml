# Compiles and tests every push, on any branch, without needing the signing secrets.
# Kotlin compile errors are turned into annotations, so they show on the run's summary page.

name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          # Kotlin: "e: file:///…/Foo.kt:12:5 message"
          grep -E '^e: ' build.log | head -50 | while IFS= read -r line; do
            loc=$(echo "$line" | sed -E 's#^e: (file://)?([^ ]+):([0-9]+):([0-9]+) .*#\2|\3|\4#')
            msg=$(echo "$line" | sed -E 's#^e: (file://)?[^ ]+:[0-9]+:[0-9]+ ##')
            file=$(echo "$loc" | cut -d'|' -f1 | sed "s#^$GITHUB_WORKSPACE/##")
            lineno=$(echo "$loc" | cut -d'|' -f2)
            col=$(echo "$loc" | cut -d'|' -f3)
            echo "::error file=$file,line=$lineno,col=$col::$msg"
          done
          # Anything else that failed (resources, manifest, tests).
          grep -E 'FAILED|AAPT: error|error: |What went wrong' -A3 build.log | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: Keep the debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apexview-fold-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
